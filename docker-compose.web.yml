services:
  deepwrite-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: deepwrite-web
    init: true
    restart: unless-stopped
    environment:
      DEEPWRITE_WEB_SECRET: ${DEEPWRITE_WEB_SECRET:-}
    command:
      - --port
      - "8742"
      - --data-dir
      - /data
      - --workspace-dir
      - /workspace
    ports:
      - "127.0.0.1:8742:8742"
    volumes:
      - deepwrite-web-data:/data
      - deepwrite-web-workspace:/workspace
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8742/deepwrite/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  deepwrite-web-data:
  deepwrite-web-workspace:
